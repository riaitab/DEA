<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beheerders Dashboard - DEA</title>
    <!-- Supabase inladen -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            padding: 20px; 
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .login-container {
            background-color: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px;
            margin-top: 50px;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            padding: 15px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-container button:hover { background-color: #004494; }
        .dashboard-container { 
            background-color: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 1100px; 
            overflow-x: auto; 
            display: none; 
        }
        .header-balk {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
        }
        h2 { color: #333; margin: 0; }
        .uitlog-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .uitlog-btn:hover { background-color: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0056b3; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .bedrag { text-align: right; font-weight: bold; }
        .tijden-kolom { font-size: 0.9em; color: #555; }
    </style>
</head>
<body>

<!-- INLOG SCHERM -->
<div id="loginScherm" class="login-container">
    <h2 style="text-align: center; border: none;">Beheerder Inloggen</h2>
    <form id="loginForm">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" required placeholder="jouw@email.nl">
        
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" required placeholder="••••••••">
        
        <button type="submit">Inloggen</button>
    </form>
</div>

<!-- DASHBOARD SCHERM -->
<div id="dashboardScherm" class="dashboard-container">
    <div class="header-balk">
        <h2>Ritten Overzicht</h2>
        <button id="logoutBtn" class="uitlog-btn">Uitloggen</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Ritnummer</th>
                <th>Chauffeur</th>
                <th>Vrachtwagen</th>
                <th>Tijden & Pauze</th>
                <th>Netto Uren</th>
                <th class="bedrag">Loonkosten</th>
                <th class="bedrag">Omzet (Facturatie)</th>
            </tr>
        </thead>
        <tbody id="rittenTabel">
            <tr><td colspan="8" style="text-align: center;">Gegevens laden...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // --- JOUW SUPABASE GEGEVENS ---
    const SUPABASE_URL = 'https://lmclewyqceztcsvqkoaf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_gv68Kwlf5w0P8bry7hMBaw_SrE_sAjS';
    // ------------------------------------------

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkLogin() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            toonDashboard();
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert("Inloggen mislukt: Controleer je e-mailadres en wachtwoord.");
        } else {
            document.getElementById('loginForm').reset();
            toonDashboard();
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', async function() {
        await db.auth.signOut();
        document.getElementById('dashboardScherm').style.display = 'none';
        document.getElementById('loginScherm').style.display = 'block';
    });

    function toonDashboard() {
        document.getElementById('loginScherm').style.display = 'none';
        document.getElementById('dashboardScherm').style.display = 'block';
        laadDashboard();
    }

    async function laadDashboard() {
        const { data: chauffeurs } = await db.from('chauffeurs').select('*');
        const { data: vrachtwagens } = await db.from('vrachtwagens').select('*');
        const { data: ritten, error } = await db.from('urenregistratie').select('*').order('datum', { ascending: false });

        const tabelBody = document.getElementById('rittenTabel');

        if (error) {
            tabelBody.innerHTML = `<tr><td colspan="8" style="color: red; text-align: center;">Fout bij laden: ${error.message}</td></tr>`;
            return;
        }

        if (!ritten || ritten.length === 0) {
            tabelBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Nog geen ritten gevonden in de database.</td></tr>';
            return;
        }

        // Oplossing "Onbekend": we gebruiken '==' in plaats van '===' zodat een tekst en een cijfer wel matchen
        const getChauffeurNaam = (id) => chauffeurs?.find(c => c.id == id)?.naam || 'Onbekend';
        const getVrachtwagenKenteken = (id) => vrachtwagens?.find(v => v.id == id)?.kenteken || 'Onbekend';

        tabelBody.innerHTML = ''; 

        ritten.forEach(rit => {
            const tr = document.createElement('tr');
            
            const loon = rit.totaal_loon_bedrag !== null ? `€ ${rit.totaal_loon_bedrag.toFixed(2)}` : '€ 0.00';
            const omzet = rit.totaal_facturatie_bedrag !== null ? `€ ${rit.totaal_facturatie_bedrag.toFixed(2)}` : '€ 0.00';
            const uren = rit.netto_gewerkte_uren !== null ? rit.netto_gewerkte_uren : '0.00';
            const ritnummer = rit.rit_omschrijving ? rit.rit_omschrijving : '-'; // Controleer of ritnummer is ingevuld

            tr.innerHTML = `
                <td><strong>${rit.datum}</strong><br><small>Week ${rit.weeknummer}</small></td>
                <td><strong>${ritnummer}</strong></td>
                <td>${getChauffeurNaam(rit.chauffeur_id)}</td>
                <td>${getVrachtwagenKenteken(rit.vrachtwagen_id)}</td>
                <td class="tijden-kolom">${rit.starttijd} - ${rit.eindtijd}<br>${rit.pauze_minuten} min pauze</td>
                <td>${uren} uur</td>
                <td class="bedrag">${loon}</td>
                <td class="bedrag" style="color: green;">${omzet}</td>
            `;
            
            tabelBody.appendChild(tr);
        });
    }

    checkLogin();
</script>

</body>
</html>
